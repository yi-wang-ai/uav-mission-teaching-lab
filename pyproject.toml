[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-mission-teaching-lab"
version = "0.1.0"
description = "Simulation-only UAV mission automation, evidence logging and teaching exercises"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
px4 = ["mavsdk-grpc==4.0.5"]

[project.scripts]
uav-lab = "uav_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["uav_lab*"]
