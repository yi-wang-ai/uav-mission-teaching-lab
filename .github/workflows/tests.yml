name: Software tests (not flight validation)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
  installed-package-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[px4]'
      - name: Test SDK constructor contract (does not connect to a simulator)
        run: python -m unittest discover -s tests -v
